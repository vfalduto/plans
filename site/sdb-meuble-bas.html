<script type="application/json" id="traduction">{"cible": "sdb/meuble-bas/", "garde": false, "ancres": {"iso": "iso?k=iso", "structure": "explication", "placard": "explication", "f-placard": "plans?k=placard", "porte": "explication", "f-porte": "plans?k=porte", "pieds": "explication", "f-joue": "plans?k=joue", "finition": "decoupe", "colonne": "explication", "f-colonne": "plans?k=colonne", "f-colonne-dessus": "plans?k=colonne-dessus", "plan": "plans?k=plan", "f-plan": "plans?k=plan", "elevation": "plans?k=elevation", "f-face": "plans?k=elevation", "coupe": "plans?k=coupe", "f-coupe": "plans?k=coupe", "mesures": "explication"}, "motifs": [], "pages": {"changements": "sdb/meuble-bas/historique.html"}}</script>
<script>(function () {
  var t = JSON.parse(document.getElementById("traduction").textContent);
  var id = decodeURIComponent(location.hash.slice(1)), frag = "";
  var a = function (table) { return Object.prototype.hasOwnProperty.call(table, id); };
  if (a(t.pages)) { location.replace(t.pages[id]); return; }
  if (a(t.ancres)) frag = t.ancres[id];
  else if (t.garde) frag = location.hash.slice(1);
  else for (var i = 0; id && i < t.motifs.length; i++) {
    var m = new RegExp(t.motifs[i][0]).exec(id);
    if (m) { frag = t.motifs[i][1].replace(/\{(\d+)\}/g, function (_, n) { return (m[n] || "").toUpperCase(); }); break; }
  }
  location.replace(t.cible + (frag ? "#" + frag : ""));
})();</script>
